<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TomOntzorgt | Samen ontdekken wat wél kan</title>
  <meta name="description" content="TomOntzorgt helpt jongeren hun talenten ontdekken, verbinding maken en groeien op school, in hun vrije tijd en richting werk.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #102d3b;
      --navy-light: #173d49;
      --green: #37675d;
      --green-light: #dce7d8;
      --orange: #e96b3e;
      --orange-dark: #d95a31;
      --yellow: #f0d27a;
      --paper: #faf8f2;
      --paper-dark: #f0ece3;
      --white: #ffffff;
      --text: #18313e;
      --muted: #64747a;
      --line: rgba(17,45,60,.14);
      --max: 1240px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      background: var(--paper);
      color: var(--text);
      font-family: "DM Sans", Arial, sans-serif;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    h1,
    h2,
    h3,
    h4 {
      margin: 0;
      font-family: "Manrope", Arial, sans-serif;
      line-height: 1.04;
      letter-spacing: -.045em;
    }

    p {
      line-height: 1.7;
    }

    .container {
      width: min(var(--max), calc(100% - 48px));
      margin: auto;
    }

    /* ==========================
       BUTTONS
    ========================== */

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      min-height: 48px;
      padding: 0 20px;

      border: 0;
      border-radius: 999px;

      background: var(--orange);
      color: white;

      font-weight: 700;
      transition: .2s ease;
    }

    .button:hover {
      background: var(--orange-dark);
      transform: translateY(-2px);
    }

    .button span {
      width: 25px;
      height: 25px;

      display: grid;
      place-items: center;

      border-radius: 50%;
      background: rgba(255,255,255,.18);
    }

    .button-outline {
      border: 1px solid rgba(16,45,59,.35);
      background: transparent;
      color: var(--navy);
    }

    .button-outline:hover {
      background: var(--navy);
      color: white;
    }

    /* ==========================
       HEADER
    ========================== */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;

      height: 76px;

      background: rgba(255,255,255,.96);
      backdrop-filter: blur(14px);

      border-bottom: 1px solid rgba(16,45,59,.08);
    }

    .header-inner {
      height: 100%;

      display: flex;
      align-items: center;
      gap: 32px;
    }

    .logo {
      font-family: "Manrope", sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1.5px;
      white-space: nowrap;
    }

    .logo span {
      font-weight: 500;
    }

    nav {
      margin-left: auto;

      display: flex;
      align-items: center;
      gap: 25px;

      font-size: 13px;
      font-weight: 700;
    }

    nav > a:not(.button) {
      position: relative;
      padding: 29px 0;
    }

    nav > a:not(.button)::after {
      content: "";

      position: absolute;
      bottom: 20px;
      left: 0;

      width: 0;
      height: 2px;

      background: var(--orange);

      transition: .25s;
    }

    nav > a:not(.button):hover::after {
      width: 100%;
    }

    .mobile-menu {
      display: none;
      margin-left: auto;
      font-size: 26px;
    }

    /* ==========================
       HERO
    ========================== */

    .hero {
      min-height: 680px;
      overflow: hidden;
      background: white;
    }

    .hero-grid {
      min-height: 680px;

      display: grid;
      grid-template-columns: 46% 54%;
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;

      padding:
        75px
        55px
        90px
        max(24px, calc((100vw - var(--max)) / 2));
    }

    .eyebrow {
      margin-bottom: 17px;

      color: var(--green);

      font-size: 12px;
      font-weight: 800;

      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .hero h1 {
      max-width: 650px;

      color: var(--navy);

      font-size: clamp(51px, 5.8vw, 83px);
    }

    .hand-title {
      position: relative;

      display: inline-block;

      color: var(--green);

      font-family: "Patrick Hand", cursive;
      font-weight: 400;
      letter-spacing: 0;
    }

    .hand-title::after {
      content: "";

      position: absolute;
      right: 0;
      bottom: -3px;
      left: 0;

      height: 6px;

      border-radius: 50%;
      background: var(--yellow);

      transform: rotate(-1deg);
      z-index: -1;
    }

    .hero-description {
      max-width: 550px;

      margin: 26px 0 30px;

      color: var(--muted);
      font-size: 17px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
    }

    .stats {
      display: flex;
      margin-top: 38px;
    }

    .stat {
      min-width: 110px;

      padding: 0 27px;

      border-left: 1px solid var(--line);
    }

    .stat:first-child {
      padding-left: 0;
      border: 0;
    }

    .stat strong {
      display: block;

      font-family: "Manrope";
      font-size: 25px;
      font-weight: 800;
    }

    .stat small {
      color: var(--muted);
    }

    .hero-image {
      position: relative;

      min-height: 680px;

      background:
        linear-gradient(
          90deg,
          rgba(255,255,255,.08),
          transparent 25%
        ),
        url("https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1600&q=88")
        center / cover;

      clip-path: polygon(
        7% 0,
        100% 0,
        100% 100%,
        0 98%,
        4% 80%,
        0 64%,
        4% 45%,
        1% 25%
      );
    }

    .hero-writing {
      position: absolute;
      top: 13%;
      right: 10%;

      color: white;

      font-family: "Patrick Hand";
      font-size: 29px;
      line-height: 1;

      text-align: center;

      transform: rotate(-6deg);

      text-shadow: 0 3px 15px rgba(0,0,0,.4);
    }

    .sticky-note {
      position: absolute;
      right: 8%;
      bottom: 8%;

      padding: 14px 17px;

      background: #d4e3a1;
      color: var(--navy);

      box-shadow: 0 12px 30px rgba(0,0,0,.15);

      font-family: "Patrick Hand";
      font-size: 22px;
      line-height: 1.05;

      transform: rotate(5deg);
    }

    /* ==========================
       INTRO
    ========================== */

    .intro {
      padding: 110px 0;
    }

    .intro-grid {
      display: grid;
      grid-template-columns: .85fr 1.15fr;

      gap: 80px;
      align-items: center;
    }

    .section-title {
      color: var(--navy);
      font-size: clamp(40px, 4.7vw, 64px);
    }

    .section-copy {
      margin: 24px 0 28px;

      color: var(--muted);
      font-size: 17px;
    }

    .text-link {
      display: inline-block;

      padding-bottom: 5px;

      border-bottom: 2px solid var(--orange);

      font-weight: 800;
    }

    /* COLLAGE */

    .collage {
      position: relative;
      height: 500px;
    }

    .photo {
      position: absolute;

      overflow: hidden;

      background: white;

      box-shadow: 0 18px 40px rgba(17,45,60,.15);
    }

    .photo-1 {
      top: 55px;
      left: 0;

      width: 38%;
      height: 65%;

      transform: rotate(-4deg);
    }

    .photo-2 {
      top: 0;
      left: 31%;

      width: 47%;
      height: 82%;

      transform: rotate(2deg);
    }

    .photo-3 {
      right: 0;
      bottom: 15px;

      width: 32%;
      height: 52%;

      transform: rotate(5deg);
    }

    .collage-note {
      position: absolute;
      z-index: 4;

      bottom: 20px;
      left: 42%;

      padding: 10px 15px;

      background: #eee1c4;

      box-shadow: 0 8px 25px rgba(0,0,0,.08);

      font-family: "Patrick Hand";
      font-size: 22px;

      transform: rotate(-3deg);
    }

    /* ==========================
       ROUTE
    ========================== */

    .route {
      position: relative;

      padding: 95px 0 115px;

      overflow: hidden;

      background: var(--paper-dark);
    }

    .route-header {
      max-width: 750px;

      margin: auto auto 65px;

      text-align: center;
    }

    .route-header p {
      color: var(--muted);
    }

    .steps {
      position: relative;

      display: grid;
      grid-template-columns: repeat(4,1fr);

      gap: 28px;
    }

    .steps::before {
      content: "";

      position: absolute;
      top: 37px;
      right: 9%;
      left: 9%;

      height: 2px;

      background: rgba(55,103,93,.25);
    }

    .step {
      position: relative;
      z-index: 2;
    }

    .step-icon {
      width: 76px;
      height: 76px;

      display: grid;
      place-items: center;

      margin-bottom: 22px;

      border: 1px solid rgba(55,103,93,.22);
      border-radius: 50%;

      background: var(--paper);

      color: var(--green);

      font-size: 26px;
    }

    .step:nth-child(2) .step-icon {
      background: var(--yellow);
    }

    .step:nth-child(3) .step-icon {
      background: #c8ddc7;
    }

    .step:nth-child(4) .step-icon {
      background: var(--orange);
      color: white;
    }

    .step h3 {
      margin-bottom: 9px;
      font-size: 22px;
    }

    .step p {
      max-width: 240px;

      margin: 0;

      color: var(--muted);
      font-size: 14px;
    }

    /* ==========================
       QUOTE
    ========================== */

    .quote-section {
      position: relative;

      min-height: 580px;

      display: flex;
      align-items: center;

      color: white;

      background:
        url("https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=1900&q=88")
        center / cover;
    }

    .quote-section::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          90deg,
          rgba(10,39,50,.92),
          rgba(10,39,50,.48) 60%,
          rgba(10,39,50,.08)
        );
    }

    .quote-content {
      position: relative;
      z-index: 2;

      max-width: 700px;

      padding: 100px 0;
    }

    .quote-mark {
      height: 65px;

      color: var(--yellow);

      font-family: Georgia, serif;
      font-size: 115px;
      line-height: .8;
    }

    .quote-content h2 {
      font-size: clamp(39px,4.5vw,61px);
      font-weight: 600;
    }

    .quote-content p {
      color: rgba(255,255,255,.72);
    }

    .quote-hand {
      position: absolute;
      right: 7%;
      bottom: 15%;

      color: white;

      font-family: "Patrick Hand";
      font-size: 28px;

      transform: rotate(6deg);
    }

    /* ==========================
       CODE TOM
    ========================== */

    .code {
      padding: 105px 0;

      background: white;
    }

    .code-grid {
      display: grid;
      grid-template-columns: .7fr 1.3fr;

      gap: 90px;
      align-items: center;
    }

    .code-copy {
      max-width: 330px;

      color: var(--muted);
    }

    .tom-letters {
      margin-top: 35px;

      font-family: "Manrope";
      font-size: 110px;
      font-weight: 800;

      line-height: .77;
      letter-spacing: -10px;
    }

    .tom-letters span {
      display: block;
    }

    .tom-letters span:nth-child(1) {
      color: var(--green);
    }

    .tom-letters span:nth-child(2) {
      color: var(--orange);
    }

    .tom-letters span:nth-child(3) {
      color: #d2a72e;
    }

    .values {
      border-top: 1px solid var(--line);
    }

    .value {
      display: grid;
      grid-template-columns: 65px 1fr;

      gap: 25px;

      padding: 28px 0;

      border-bottom: 1px solid var(--line);
    }

    .value-letter {
      font-family: "Manrope";
      font-size: 28px;
      font-weight: 800;
    }

    .value h3 {
      margin-bottom: 6px;
      font-size: 25px;
    }

    .value p {
      margin: 0;

      color: var(--muted);
    }

    /* ==========================
       OUDERS / SCHOLEN
    ========================== */

    .audiences {
      padding: 100px 0;
    }

    .audience-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 50px;
    }

    .audience {
      display: grid;
      grid-template-columns: 1.05fr .95fr;

      gap: 25px;
      align-items: center;

      padding-top: 25px;

      border-top: 1px solid rgba(55,103,93,.35);
    }

    .audience h3 {
      font-size: 31px;
    }

    .audience p {
      color: var(--muted);
    }

    .polaroid {
      height: 310px;

      padding: 9px 9px 32px;

      background: white;

      box-shadow: 0 13px 35px rgba(17,45,60,.15);

      transform: rotate(3deg);
    }

    .audience:nth-child(2) .polaroid {
      transform: rotate(-3deg);
    }

    /* ==========================
       LOCATIONS
    ========================== */

    .locations {
      padding: 95px 0;

      background: var(--paper-dark);
    }

    .location-grid {
      display: grid;
      grid-template-columns: .7fr 1
