<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TomOntzorgt | Samen ontdekken wat wél kan</title>
  <meta
    name="description"
    content="TomOntzorgt helpt jongeren hun talenten ontdekken, verbinding maken en groeien op school, in hun vrije tijd en richting werk."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #112d3c;
      --navy-2: #173c48;
      --green: #37685e;
      --green-light: #dce7d8;
      --orange: #e9693d;
      --orange-dark: #d9582f;
      --yellow: #f2d77e;

      --paper: #faf8f2;
      --paper-dark: #f1ede4;
      --white: #ffffff;

      --text: #18313e;
      --muted: #64747a;
      --line: rgba(17, 45, 60, 0.14);

      --max-width: 1240px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }

    body.menu-open {
      overflow: hidden;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    h1,
    h2,
    h3,
    h4 {
      margin: 0;
      font-family: "Manrope", sans-serif;
      letter-spacing: -0.045em;
      line-height: 1.04;
    }

    p {
      line-height: 1.7;
    }

    .container {
      width: min(var(--max-width), calc(100% - 48px));
      margin: 0 auto;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .site-header {
      height: 76px;
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(17, 45, 60, 0.08);
    }

    .header-inner {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      font-family: "Manrope", sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1.5px;
      white-space: nowrap;
    }

    .logo span {
      font-weight: 500;
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 27px;
      margin-left: auto;
      font-size: 13px;
      font-weight: 700;
    }

    .desktop-nav > a:not(.button) {
      position: relative;
      padding: 28px 0;
    }

    .desktop-nav > a:not(.button)::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 20px;
      width: 0;
      height: 2px;
      background: var(--orange);
      transition: width 0.25s ease;
    }

    .desktop-nav > a:not(.button):hover::after {
      width: 100%;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      min-height: 48px;
      padding: 0 20px;
      border: 0;
      border-radius: 999px;
      background: var(--orange);
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .button:hover {
      background: var(--orange-dark);
      transform: translateY(-2px);
    }

    .button-arrow {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
    }

    .button-outline {
      color: var(--navy);
      background: transparent;
      border: 1px solid rgba(17, 45, 60, 0.4);
    }

    .button-outline:hover {
      color: white;
      background: var(--navy);
    }

    .mobile-toggle {
      display: none;
      width: 46px;
      height: 46px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--paper-dark);
      color: var(--navy);
      font-size: 22px;
      cursor: pointer;
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      position: relative;
      min-height: 680px;
      background: white;
      overflow: hidden;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 46% 54%;
      min-height: 680px;
    }

    .hero-copy {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding:
        72px 60px 90px
        max(24px, calc((100vw - var(--max-width)) / 2));
    }

    .eyebrow {
      margin-bottom: 16px;
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .hero h1 {
      max-width: 640px;
      color: var(--navy);
      font-size: clamp(52px, 5.8vw, 82px);
    }

    .handwriting {
      position: relative;
      display: inline-block;
      color: var(--green);
      font-family: "Patrick Hand", cursive;
      font-weight: 400;
      letter-spacing: 0;
    }

    .handwriting::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -5px;
      left: 0;
      height: 6px;
      border-radius: 50%;
      background: var(--yellow);
      transform: rotate(-1deg);
      z-index: -1;
    }

    .hero-description {
      max-width: 550px;
      margin: 26px 0 30px;
      color: var(--muted);
      font-size: 17px;
    }

    .hero-buttons {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 11px;
    }

    .hero-stats {
      display: flex;
      align-items: center;
      gap: 0;
      margin-top: 38px;
    }

    .hero-stat {
      min-width: 105px;
      padding: 0 26px;
      border-left: 1px solid var(--line);
    }

    .hero-stat:first-child {
      padding-left: 0;
      border-left: 0;
    }

    .hero-stat strong {
      display: block;
      color: var(--navy);
      font-family: "Manrope", sans-serif;
      font-size: 25px;
      font-weight: 800;
    }

    .hero-stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .hero-visual {
      position: relative;
      min-height: 680px;
      background:
        linear-gradient(
          90deg,
          rgba(255,255,255,0.08),
          transparent 25%
        ),
        url("https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1600&q=88")
        center / cover no-repeat;

      clip-path: polygon(
        7% 0,
        100% 0,
        100% 100%,
        1% 98%,
        4% 82%,
        0 65%,
        4% 48%,
        1% 28%
      );
    }

    .hero-scribble {
      position: absolute;
      top: 13%;
      right: 11%;
      color: white;
      font-family: "Patrick Hand", cursive;
      font-size: 28px;
      line-height: 1;
      text-align: center;
      text-shadow: 0 3px 16px rgba(0,0,0,0.4);
      transform: rotate(-7deg);
    }

    .hero-note {
      position: absolute;
      right: 8%;
      bottom: 8%;
      padding: 15px 18px;
      background: #d3e39f;
      box-shadow: 0 12px 30px rgba(0,0,0,0.14);
      color: var(--navy);
      font-family: "Patrick Hand", cursive;
      font-size: 22px;
      line-height: 1.05;
      transform: rotate(5deg);
    }

    /* =========================================================
       INTRO
    ========================================================= */

    .intro {
      position: relative;
      padding: 105px 0;
    }

    .intro-grid {
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      align-items: center;
      gap: 80px;
    }

    .section-title {
      color: var(--navy);
      font-size: clamp(39px, 4.7vw, 64px);
    }

    .section-text {
      margin: 24px 0 28px;
      color: var(--muted);
      font-size: 17px;
    }

    .simple-link {
      display: inline-block;
      padding-bottom: 4px;
      border-bottom: 2px solid var(--orange);
      font-weight: 800;
    }

    .collage {
      position: relative;
      height: 500px;
    }

    .collage-photo {
      position: absolute;
      overflow: hidden;
      background: white;
      box-shadow: 0 18px 40px rgba(17,45,60,0.15);
    }

    .collage-photo.one {
      top: 50px;
      left: 0;
      width: 38%;
      height: 67%;
      transform: rotate(-4deg);
    }

    .collage-photo.two {
      top: 0;
      left: 31%;
      width: 47%;
      height: 82%;
      transform: rotate(2deg);
    }

    .collage-photo.three {
      right: 0;
      bottom: 10px;
      width: 32%;
      height: 52%;
      transform: rotate(5deg);
    }

    .collage-label {
      position: absolute;
      z-index: 4;
      bottom: 20px;
      left: 42%;
      padding: 10px 15px;
      background: #eee1c4;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      font-family: "Patrick Hand", cursive;
      font-size: 22px;
      transform: rotate(-3deg);
    }

    .collage-hand {
      position: absolute;
      z-index: 5;
      top: 28px;
      right: -8px;
      width: 150px;
      font-family: "Patrick Hand", cursive;
      font-size: 21px;
      line-height: 1.1;
      transform: rotate(5deg);
    }

    /* =========================================================
       ROUTE
    ========================================================= */

    .route {
      position: relative;
      padding: 90px 0 110px;
      background: var(--paper-dark);
      overflow: hidden;
    }

    .route::before,
    .route::after {
      content: "";
      position: absolute;
      left: -5%;
      width: 110%;
      height: 60px;
      background: var(--paper);
      border-radius: 50%;
    }

    .route::before {
      top: -42px;
    }

    .route::after {
      bottom: -48px;
    }

    .route-heading {
      max-width: 760px;
      margin: 0 auto 65px;
      text-align: center;
    }

    .route-heading p {
      color: var(--muted);
    }

    .route-steps {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 30px;
    }

    .route-line {
      position: absolute;
      top: 37px;
      right: 9%;
      left: 9%;
      height: 2px;
      background: rgba(55,104,94,0.25);
    }

    .route-step {
      position: relative;
      z-index: 2;
    }

    .route-icon {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin-bottom: 22px;
      border: 1px solid rgba(55,104,94,0.2);
      border-radius: 50%;
      background: var(--paper);
      color: var(--green);
      font-size: 26px;
    }

    .route-step:nth-child(2) .route-icon {
      background: var(--yellow);
    }

    .route-step:nth-child(3) .route-icon {
      background: #c9dec7;
    }

    .route-step:nth-child(4) .route-icon {
      background: var(--orange);
      color: white;
    }

    .route-step h3 {
      margin-bottom: 9px;
      font-size: 22px;
    }

    .route-step p {
      max-width: 240px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    /* =========================================================
       BIG QUOTE
    ========================================================= */

    .quote-section {
      position: relative;
      min-height: 590px;
      display: flex;
      align-items: center;
      color: white;
      background:
        url("https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=1900&q=88")
        center 45% / cover no-repeat;
    }

    .quote-section::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          90deg,
          rgba(12,42,51,0.92),
          rgba(12,42,51,0.45) 58%,
          rgba(12,42,51,0.08)
        );
    }

    .quote-content {
      position: relative;
      z-index: 2;
      max-width: 690px;
      padding: 100px 0;
    }

    .quote-mark {
      height: 60px;
      color: var(--yellow);
      font-family: Georgia, serif;
      font-size: 110px;
      line-height: 0.8;
    }

    .quote-content h2 {
      font-size: clamp(38px, 4.5vw, 61px);
      font-weight: 600;
    }

    .quote-person {
      margin-top: 25px;
      color: rgba(255,255,255,0.72);
    }

    .quote-hand {
      position: absolute;
      right: 6%;
      bottom: 16%;
      color: white;
      font-family: "Patrick Hand", cursive;
      font-size: 28px;
      transform: rotate(6deg);
    }

    /* =========================================================
       CODE TOM
    ========================================================= */

    .code {
      padding: 105px 0;
      background: white;
    }

    .code-grid {
      display: grid;
      grid-template-columns: 0.7fr 1.3fr;
      align-items: center;
      gap: 85px;
    }

    .code-description {
      max-width: 320px;
      color: var(--muted);
    }

    .tom-letters {
      margin-top: 35px;
      font-family: "Manrope", sans-serif;
      font-size: 110px;
      font-weight: 800;
      line-height: 0.77;
      letter-spacing: -10px;
    }

    .tom-letters span {
      display: block;
    }

    .tom-letters span:nth-child(1) {
      color: var(--green);
    }

    .tom-letters span:nth-child(2) {
      color: var(--orange);
    }

    .tom-letters span:nth-child(3) {
      color: #d1a72f;
    }

    .values {
      border-top: 1px solid var(--line);
    }

    .value {
      display: grid;
      grid-template-columns: 65px 1fr;
      gap: 24px;
      padding: 27px 0;
      border-bottom:
